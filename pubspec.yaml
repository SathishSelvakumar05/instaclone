name: alab
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  fluttertoast: ^8.2.4
  nb_utils: ^7.1.8
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  file_picker: ^10.3.7
  flutter_secure_storage: ^9.2.4
  tflite_flutter: ^0.12.1
  flutter_debouncer: ^2.1.1
  connectivity_plus: ^6.1.5
  internet_connection_checker: ^3.0.1
  sqflite: ^2.4.2
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.4
  video_player: ^2.9.2
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# Icon configuration (separate block)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/Images/alab.png"

flutter:
  uses-material-design: true
  assets:
    - assets/Images/alab.png
